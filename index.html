<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="2dC2tt5bkLxu3zglkZNgw5">
<head data-page-node-id="JbfLHsIcqPYWrlriqAwNDa">
    <meta charset="UTF-8" data-page-node-id="hFT9OnOKBzRVEaBVlTg4vs">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="LZ1H6u7jyIVRa5UkyOUzgk">
    <title>Todo 列表 V2.1 —— 支持编辑</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .todo-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .todo-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #6c5ce7;
        }

        .input-group button {
            padding: 12px 24px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .input-group button:hover {
            background-color: #5b4cdb;
        }

        .input-group button:active {
            transform: scale(0.96);
        }

        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-group button {
            flex: 1;
            padding: 8px 0;
            background-color: #f1f3f5;
            color: #666;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-group button:hover {
            background-color: #e9ecef;
        }

        .filter-group button.active {
            background-color: #6c5ce7;
            border-color: #6c5ce7;
            color: #fff;
            font-weight: 600;
        }

        #todo-list {
            list-style: none;
        }

        #todo-list li {
            background-color: #f8f9fa;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #444;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 4px;
            border-left: 4px solid #6c5ce7;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.02);
            transition: background-color 0.2s ease;
            cursor: pointer;
        }

        #todo-list li:hover {
            background-color: #f1f3f5;
        }

        #todo-list li .todo-text {
            flex: 1;
            min-width: 0;
            overflow-wrap: anywhere;
        }

        #todo-list li.done {
            color: #aaa;
            text-decoration: line-through;
            border-left-color: #b8b8b8;
        }

        #todo-list li .icon-btn {
            flex: none;
            margin-left: 4px;
            border: none;
            background: none;
            color: #999;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        #todo-list li .edit-btn:hover   { color: #6c5ce7; }
        #todo-list li .del-btn:hover    { color: #e74c3c; }
        #todo-list li .save-btn:hover   { color: #27ae60; }
        #todo-list li .cancel-btn:hover { color: #e74c3c; }

        #todo-list li.editing {
            background-color: #ffffff;
            border-left-color: #f0b429;
            cursor: default;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.12);
        }

        #todo-list li.editing:hover {
            background-color: #ffffff;
        }

        #todo-list li .edit-input {
            flex: 1;
            min-width: 0;
            padding: 6px 10px;
            font-size: 15px;
            font-family: inherit;
            color: #333;
            border: 2px solid #6c5ce7;
            border-radius: 6px;
            outline: none;
            background: #fff;
        }
    </style>
</head>
<body data-page-node-id="FoNrEKeTV92Gy0npIQPXVs">

    <div class="todo-container" data-page-node-id="B5th0YtNR4uxy6d9B2LlTg">
        <h2 data-page-node-id="hlsD4FhalJRr1Yg3CaT5Ay">我的待办清单 V2.1</h2>

        <div class="input-group" data-page-node-id="j1C7TTCpCdaNcxwtn7mOdO">
            <input type="text" id="todo-input" placeholder="今天要做什么？" data-page-node-id="NBCUUMYRdhRmcv2RI7QaY0">
            <button id="add-btn" data-page-node-id="FyURgxqpew7PQl59E3jOnh">添加</button>
        </div>

        <div class="filter-group" data-page-node-id="rRHE9VZwTQ5woo6G9Ep1WR">
            <button data-filter="all" class="active" data-page-node-id="mE44wZEvwHdOmzmLakJN6c">全部</button>
            <button data-filter="active" data-page-node-id="GXCyrVLFLNe8CEeWsxEQEO">未完成</button>
            <button data-filter="done" data-page-node-id="7dYCy0KAJm8tS8oqRbzIO1">已完成</button>
        </div>

        <ul id="todo-list" data-page-node-id="JsT32OKdIQ4YQ36h9ElwKO"></ul>
    </div>

    <script>
        const KEY = 'todos';

        const list   = document.querySelector('#todo-list');
        const input  = document.querySelector('#todo-input');
        const addBtn = document.querySelector('#add-btn');

        function save() {
            console.log('save()');
            localStorage.setItem(KEY, JSON.stringify(todos));
        }

        function load() {
            const raw = localStorage.getItem(KEY);
            if (raw === null) return [];
            return JSON.parse(raw);
        }

        let todos = load();
        let filter = 'all';
        let editingId = null;

        function render() {
            console.log('render()');
            list.innerHTML = '';

            const shown = todos.filter(t =>
                filter === 'all'  ? true :
                filter === 'done' ? t.completed : !t.completed);

            shown.forEach(t => {
                const li = document.createElement('li');
                li.dataset.id = t.id;
                if (t.completed) li.classList.add('done');

                if (t.id === editingId) {
                    li.classList.add('editing');

                    const editInput = document.createElement('input');
                    editInput.type = 'text';
                    editInput.className = 'edit-input';
                    editInput.value = t.text;
                    editInput.placeholder = '输入新的内容…';

                    const saveBtn = document.createElement('button');
                    saveBtn.className = 'icon-btn save-btn';
                    saveBtn.dataset.action = 'save';
                    saveBtn.title = '保存（Enter）';
                    saveBtn.textContent = '✓';

                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = 'icon-btn cancel-btn';
                    cancelBtn.dataset.action = 'cancel';
                    cancelBtn.title = '取消（Esc）';
                    cancelBtn.textContent = '✗';

                    li.append(editInput, saveBtn, cancelBtn);
                } else {
                    const span = document.createElement('span');
                    span.className = 'todo-text';
                    span.textContent = t.text;

                    const editBtn = document.createElement('button');
                    editBtn.className = 'icon-btn edit-btn';
                    editBtn.dataset.action = 'edit';
                    editBtn.title = '编辑';
                    editBtn.textContent = '✎';

                    const delBtn = document.createElement('button');
                    delBtn.className = 'icon-btn del-btn';
                    delBtn.dataset.action = 'delete';
                    delBtn.title = '删除';
                    delBtn.textContent = '×';

                    li.append(span, editBtn, delBtn);
                }

                list.appendChild(li);
            });

            if (editingId !== null) {
                const inp = list.querySelector('.edit-input');
                if (inp) {
                    inp.focus();
                    inp.setSelectionRange(inp.value.length, inp.value.length);
                }
            }
        }

        list.addEventListener('click', (e) => {
            if (!(e.target instanceof Element)) return;
            const item = e.target.closest('li');
            if (!item || !list.contains(item)) return;
            const id = Number(item.dataset.id);
            if (!id) return;

            const actionEl = e.target.closest('[data-action]');
            const action = actionEl ? actionEl.dataset.action : null;

            if (action === 'delete') { removeTodo(id); return; }
            if (action === 'edit')   { startEdit(id);  return; }
            if (action === 'save')   { commitEdit(id); return; }
            if (action === 'cancel') { cancelEdit();   return; }

            if (editingId !== null) return;

            toggleTodo(id);
        });

        list.addEventListener('keydown', (e) => {
            const el = e.target;
            if (!(el instanceof Element) || !el.classList.contains('edit-input')) return;
            const item = el.closest('li');
            const id = item ? Number(item.dataset.id) : NaN;
            if (!id) return;

            if (e.key === 'Enter') {
                e.preventDefault();
                commitEdit(id);
            } else if (e.key === 'Escape') {
                e.preventDefault();
                cancelEdit();
            }
        });

        function addTodo(text) {
            todos = [...todos, { id: Date.now(), text, completed: false }];
            console.log('addTodo', text);
            save(); render();
        }

        function removeTodo(id) {
            todos = todos.filter(t => t.id !== id);
            if (editingId === id) editingId = null;
            console.log('removeTodo', id);
            save(); render();
        }

        function clearCompleted() {
            todos = todos.filter(t => !t.completed);
            console.log('clearCompleted()');
            save(); render();
        }

        function toggleTodo(id) {
            todos = todos.map(t =>
                t.id === id ? { ...t, completed: !t.completed } : t);
            console.log('toggleTodo', id);
            save(); render();
        }

        function updateTodo(id, text) {
            todos = todos.map(t =>
                t.id === id ? { ...t, text } : t);
            save(); render();
        }

        function startEdit(id) {
            if (editingId === id) return;
            editingId = id;
            render();
        }

        function cancelEdit() {
            editingId = null;
            render();
        }

        function commitEdit(id) {
            const inp = list.querySelector('.edit-input');
            if (!inp) {
                editingId = null;
                render();
                return;
            }
            const value = inp.value.trim();
            if (value === '') {
                alert('任务内容不能为空！');
                inp.focus();
                return;
            }
            editingId = null;
            updateTodo(id, value);
        }

        function setFilter(f) {
            filter = f;
            editingId = null;
            render();
        }

        addBtn.addEventListener('click', () => {
            const value = input.value.trim();
            if (value === '') {
                alert('输入内容不能为空！');
                return;
            }
            addTodo(value);
            input.value = '';
            input.focus();
        });

        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });

        document.querySelectorAll('.filter-group button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.filter-group button.active')
                        .classList.remove('active');
                btn.classList.add('active');
                setFilter(btn.dataset.filter);
            });
        });

        render();
    </script>
</body>
</html>
