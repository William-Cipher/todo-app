<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 列表基础版</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ================= 页面整体布局与背景色 ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 柔和的渐变背景色 */
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            padding: 20px;
        }

        /* ================= 卡片式容器 ================= */
        .todo-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1); /* 柔和阴影 */
        }

        /* 标题样式 */
        .todo-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        /* ================= 输入区域布局 ================= */
        .input-group {
            display: flex;
            gap: 10px; /* 输入框和按钮之间的间距 */
            margin-bottom: 25px;
        }

        /* 输入框样式 */
        .input-group input {
            flex: 1; /* 占据剩余空间 */
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease; /* 过渡动画 */
        }

        /* 输入框获得焦点时的颜色 */
        .input-group input:focus {
            border-color: #6c5ce7;
        }

        /* 按钮样式 */
        .input-group button {
            padding: 12px 24px;
            background-color: #6c5ce7; /* 紫色主题色 */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        /* 按钮悬停与点击效果 */
        .input-group button:hover {
            background-color: #5b4cdb;
        }
        .input-group button:active {
            transform: scale(0.96);
        }

        /* ================= 列表区域样式 ================= */
        #todo-list {
            list-style: none; /* 去除默认的小圆点 */
        }

        /* 列表项样式 */
        #todo-list li {
            background-color: #f8f9fa;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #444;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-left: 4px solid #6c5ce7; /* 左侧点缀色 */
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: background-color 0.2s ease;
        }

        /* 鼠标悬停在列表项上时 */
        #todo-list li:hover {
            background-color: #f1f3f5;
        }
    </style>
</head>
<body>

    <!-- 使用一个容器包裹，方便进行卡片式布局 -->
    <div class="todo-container">
        <h2>我的待办清单</h2>
        
        <!-- 要求1：输入框 + 按钮 -->
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="今天要做什么？">
            <button id="add-btn">添加</button>
        </div>

        <!-- 要求2：列表容器 (<ul>) -->
        <ul id="todo-list"></ul>
    </div>

    <!-- 要求7：<script> 放在 <body> 末尾，确保 DOM 已加载 -->
    <script>
        // 获取 DOM 元素
        const todoInput = document.getElementById('todo-input');
        const addBtn = document.getElementById('add-btn');
        const todoList = document.getElementById('todo-list');

        // 要求3：点击按钮添加 Todo，用 addEventListener 监听 click 事件
        addBtn.addEventListener('click', function() {
            const inputValue = todoInput.value;

            // 要求5：边界检查，空输入不添加（用 trim() 检查）
            if (inputValue.trim() === '') {
                alert('输入内容不能为空！');
                return; 
            }

            // 要求4：显示 Todo 列表，用 createElement 和 appendChild 创建并添加列表项
            const newLi = document.createElement('li');
            newLi.textContent = inputValue.trim();
            todoList.appendChild(newLi);

            // 要求6：清空输入框（添加后清空）
            todoInput.value = '';
            
            // 额外优化：让输入框重新获得焦点，方便连续输入
            todoInput.focus();
        });

        // 额外优化：支持按回车键添加
        todoInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addBtn.click();
            }
        });
    </script>
</body>
</html>
