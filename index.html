<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 列表 V2.0 —— 数据驱动版</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ================= 页面整体布局与背景色 ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            padding: 20px;
        }

        /* ================= 卡片式容器 ================= */
        .todo-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* 标题样式 */
        .todo-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        /* ================= 输入区域布局 ================= */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #6c5ce7;
        }

        .input-group button {
            padding: 12px 24px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .input-group button:hover {
            background-color: #5b4cdb;
        }
        .input-group button:active {
            transform: scale(0.96);
        }

        /* ================= 筛选按钮区域 ================= */
        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-group button {
            flex: 1;
            padding: 8px 0;
            background-color: #f1f3f5;
            color: #666;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-group button:hover {
            background-color: #e9ecef;
        }

        /* 当前选中的筛选按钮 */
        .filter-group button.active {
            background-color: #6c5ce7;
            border-color: #6c5ce7;
            color: #fff;
            font-weight: 600;
        }

        /* ================= 列表区域样式 ================= */
        #todo-list {
            list-style: none;
        }

        #todo-list li {
            background-color: #f8f9fa;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #444;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-left: 4px solid #6c5ce7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: background-color 0.2s ease;
            cursor: pointer; /* 提示整行可点击切换完成状态 */
        }

        #todo-list li:hover {
            background-color: #f1f3f5;
        }

        /* 已完成状态：划线 + 变灰 */
        #todo-list li.done {
            color: #aaa;
            text-decoration: line-through;
            border-left-color: #b8b8b8;
        }

        /* 列表项右侧的删除按钮 */
        #todo-list li .del-btn {
            margin-left: auto;
            border: none;
            background: none;
            color: #999;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        #todo-list li .del-btn:hover {
            color: #e74c3c;
        }
    </style>
</head>
<body>

    <div class="todo-container">
        <h2>我的待办清单 V2.0</h2>

        <!-- 输入框 + 添加按钮 -->
        <div class="input-group">
            <input type="text" id="todo-input" placeholder="今天要做什么？">
            <button id="add-btn">添加</button>
        </div>

        <!-- 筛选按钮：all / active / done（视图状态，刷新后回到默认 all） -->
        <div class="filter-group">
            <button data-filter="all" class="active">全部</button>
            <button data-filter="active">未完成</button>
            <button data-filter="done">已完成</button>
        </div>

        <!-- 列表容器：DOM 只是 todos 数组的投影，由 render() 统一生成 -->
        <ul id="todo-list"></ul>
    </div>

    <script>
        // ============ ① 存储的键名 ============
        const KEY = 'todos';

        // ============ ② DOM 引用 ============
        const list   = document.querySelector('#todo-list');
        const input  = document.querySelector('#todo-input');
        const addBtn = document.querySelector('#add-btn');

        // ============ ⑤ 存 / 取：localStorage 持久化 ============
        function save() {
            localStorage.setItem(KEY, JSON.stringify(todos));
        }
        function load() {
            const raw = localStorage.getItem(KEY);
            if (raw === null) return [];        // 没存过 → 空数组
            return JSON.parse(raw);             // 存过 → 解析
        }

        // ============ ③ 单一数据源 ============
        // todos 是唯一的任务状态来源，页面（DOM）由 render() 根据 todos 生成
        // 初始数据从 localStorage 恢复 → 刷新后数据仍在
        let todos = load();

        // ============ ④ 视图状态 ============
        // filter 只决定「显示哪些」，属于视图状态，不写入 localStorage，刷新回到默认 'all'
        let filter = 'all';

        // ============ ⑥ 渲染函数：先过滤，再根据 todos 重画整个列表 ============
        function render() {
            list.innerHTML = '';               // 清空 → 重画（DOM 是数据的投影）
            const shown = todos.filter(t =>
                filter === 'all'  ? true :
                filter === 'done' ? t.completed : !t.completed);
            shown.forEach(t => {
                const li = document.createElement('li');
                li.textContent = t.text;
                li.dataset.id = t.id;          // li 记住自己的 id，后续靠它定位
                if (t.completed) li.classList.add('done');

                // 点击整行 → 切换完成状态（箭头函数捕获 t.id，避免下标闭包陷阱）
                li.addEventListener('click', () => toggleTodo(t.id));

                // 删除按钮 ×
                const delBtn = document.createElement('button');
                delBtn.textContent = '×';
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();       // 防止顺带触发 li 的点击
                    removeTodo(t.id);
                });
                li.appendChild(delBtn);

                list.appendChild(li);
            });
        }

        // ============ ⑦ 三个操作函数：不可变更新 + 三步口诀「改数据 → save → render」 ============
        // 添加：展开生成新数组
        function addTodo(text) {
            todos = [...todos, { id: Date.now(), text, completed: false }];
            save(); render();
        }

        // 删除：filter 留下 id 不匹配的
        function removeTodo(id) {
            todos = todos.filter(t => t.id !== id);
            save(); render();
        }

        // 切换：map + 展开，只替换匹配的那一条，其余原样返回
        function toggleTodo(id) {
            todos = todos.map(t =>
                t.id === id ? { ...t, completed: !t.completed } : t);
            save(); render();
        }

        // ============ 筛选：切换视图状态后重渲染（filter 是视图状态，不需要 save()） ============
        function setFilter(f) {
            filter = f;      // all / done / active
            render();
        }

        // ============ 事件绑定 ============
        addBtn.addEventListener('click', () => {
            const value = input.value.trim();   // 边界检查：空输入（含纯空格）不添加
            if (value === '') {
                alert('输入内容不能为空！');
                return;
            }
            addTodo(value);
            input.value = '';
            input.focus();
        });

        // 支持按回车键添加
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });

        // 筛选按钮绑定：点击后切换视图状态并高亮当前按钮
        document.querySelectorAll('.filter-group button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.filter-group button.active')
                        .classList.remove('active');
                btn.classList.add('active');
                setFilter(btn.dataset.filter);
            });
        });

        // 首次渲染
        render();
    </script>
</body>
</html>
