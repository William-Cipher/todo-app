<!DOCTYPE html>
<html lang="zh-CN" data-page-node-id="fYuHFSBlHsEgaZKRGwTCWe">
<head data-page-node-id="l93EqeB4dvgl4sKWVD1vC1">
    <meta charset="UTF-8" data-page-node-id="P3R0FfyNeZSe0VQ9F3RKoD">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" data-page-node-id="0TK0r8zepiHgvRKHPqtVTx">
    <title>Todo 列表 V2.0 —— 数据驱动版</title>
    <style>
        /* ================= 基础重置 ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ================= 页面整体布局与背景色 ================= */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            min-height: 100vh;
            display: flex;
            justify-content: center; /* 水平居中 */
            align-items: center;     /* 垂直居中 */
            padding: 20px;
        }

        /* ================= 卡片式容器 ================= */
        .todo-container {
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        /* 标题样式 */
        .todo-container h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
        }

        /* ================= 输入区域布局 ================= */
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .input-group input:focus {
            border-color: #6c5ce7;
        }

        .input-group button {
            padding: 12px 24px;
            background-color: #6c5ce7;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
        }

        .input-group button:hover {
            background-color: #5b4cdb;
        }
        .input-group button:active {
            transform: scale(0.96);
        }

        /* ================= 筛选按钮区域 ================= */
        .filter-group {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .filter-group button {
            flex: 1;
            padding: 8px 0;
            background-color: #f1f3f5;
            color: #666;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-group button:hover {
            background-color: #e9ecef;
        }

        /* 当前选中的筛选按钮 */
        .filter-group button.active {
            background-color: #6c5ce7;
            border-color: #6c5ce7;
            color: #fff;
            font-weight: 600;
        }

        /* ================= 列表区域样式 ================= */
        #todo-list {
            list-style: none;
        }

        #todo-list li {
            background-color: #f8f9fa;
            padding: 14px 16px;
            border-radius: 8px;
            margin-bottom: 10px;
            color: #444;
            font-size: 16px;
            display: flex;
            align-items: center;
            border-left: 4px solid #6c5ce7;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: background-color 0.2s ease;
            cursor: pointer; /* 提示整行可点击切换完成状态 */
        }

        #todo-list li:hover {
            background-color: #f1f3f5;
        }

        /* 已完成状态：划线 + 变灰 */
        #todo-list li.done {
            color: #aaa;
            text-decoration: line-through;
            border-left-color: #b8b8b8;
        }

        /* 列表项右侧的删除按钮 */
        #todo-list li .del-btn {
            margin-left: auto;
            border: none;
            background: none;
            color: #999;
            font-size: 18px;
            line-height: 1;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
        }

        #todo-list li .del-btn:hover {
            color: #e74c3c;
        }
    </style>
</head>
<body data-page-node-id="Fwru27hccqVTZH2UWWZG0n">

    <div class="todo-container" data-page-node-id="H67sreFLgoN6RJZT7zwITF">
        <h2 data-page-node-id="34DkD5kqIOEF0lnP81spFi">我的待办清单 V2.0</h2>

        <!-- 输入框 + 添加按钮 -->
        <div class="input-group" data-page-node-id="sowrnFqgGmt8EGwdZAEdoi">
            <input type="text" id="todo-input" placeholder="今天要做什么？" data-page-node-id="lYt4R0fZCDteBY8CsB3mIz">
            <button id="add-btn" data-page-node-id="LR81kem5TByS0aoVUInmWh">添加</button>
        </div>

        <!-- 筛选按钮：all / active / done（视图状态，刷新后回到默认 all） -->
        <div class="filter-group" data-page-node-id="c29EESgYNiPRneFeFiExud">
            <button data-filter="all" class="active" data-page-node-id="klpMGpHnI8igFL5gpsBLCZ">全部</button>
            <button data-filter="active" data-page-node-id="GYSEsbwZdIpxaA3BGJMwod">未完成</button>
            <button data-filter="done" data-page-node-id="puqRld0BCWlddA6KGPBAgP">已完成</button>
        </div>

        <!-- 列表容器：DOM 只是 todos 数组的投影，由 render() 统一生成 -->
        <ul id="todo-list" data-page-node-id="shhchPkfBKKIsNv1eqm0ra"></ul>
    </div>

    <script>
        // ============ ① 存储的键名 ============
        const KEY = 'todos';

        // ============ ② DOM 引用 ============
        const list   = document.querySelector('#todo-list');
        const input  = document.querySelector('#todo-input');
        const addBtn = document.querySelector('#add-btn');

        // ============ ⑤ 存 / 取：localStorage 持久化 ============
        function save() {
            console.log('save()');
            localStorage.setItem(KEY, JSON.stringify(todos));
        }
        function load() {
            const raw = localStorage.getItem(KEY);
            if (raw === null) return [];        // 没存过 → 空数组
            return JSON.parse(raw);             // 存过 → 解析
        }

        // ============ ③ 单一数据源 ============
        // todos 是唯一的任务状态来源，页面（DOM）由 render() 根据 todos 生成
        // 初始数据从 localStorage 恢复 → 刷新后数据仍在
        let todos = load();

        // ============ ④ 视图状态 ============
        // filter 只决定「显示哪些」，属于视图状态，不写入 localStorage，刷新回到默认 'all'
        let filter = 'all';

        // ============ ⑥ 渲染函数：先过滤，再根据 todos 重画整个列表 ============
        // W8：渲染只负责「造节点 + 打标记」，不再给每个 li / button 单独绑监听器
        function render() {
            console.log('render()');
            list.innerHTML = '';               // 清空 → 重画（DOM 是数据的投影）
            const shown = todos.filter(t =>
                filter === 'all'  ? true :
                filter === 'done' ? t.completed : !t.completed);
            shown.forEach(t => {
                const li = document.createElement('li');
                li.textContent = t.text;
                li.dataset.id = t.id;          // 让节点记住它是哪条数据（事件委托靠它定位）
                if (t.completed) li.classList.add('done');

                // 删除按钮 ×：只打标记，不绑事件（交互统一交给父容器 ul）
                const delBtn = document.createElement('button');
                delBtn.className = 'del-btn';
                delBtn.dataset.action = 'delete';   // [data-action="delete"] 供委托识别
                delBtn.textContent = '×';
                li.appendChild(delBtn);

                list.appendChild(li);
            });
        }

        // ============ ⑧ 事件委托：整个列表只在 ul 上绑一次监听器 ============
        // 依赖冒泡：点击 li 或按钮的事件都会冒泡到 ul，由这里统一识别、分流
        list.addEventListener('click', (e) => {
            if (!(e.target instanceof Element)) return;        // ① 防：target 不是元素
            const item = e.target.closest('li');               // 往上找最近的 li
            if (!item || !list.contains(item)) return;         // ② 防：点空白 → null；③ 防越界
            const id = Number(item.dataset.id);                // dataset 取出来是字符串，转回数字
            if (!id) return;                                   // ④ 防：li 上没有 data-id（NaN 也在此拦住）

            const delBtn = e.target.closest('[data-action="delete"]');
            if (delBtn && item.contains(delBtn)) {             // 点的是删除按钮
                removeTodo(id);
                return;                                        // ⑤ 分流后返回：一次点击只做一个操作
            }
            toggleTodo(id);                                    // 否则整行点击 = 切换完成状态
        });

        // ============ ⑦ 三个操作函数：不可变更新 + 三步口诀「改数据 → save → render」 ============
        // 添加：展开生成新数组
        function addTodo(text) {
            todos = [...todos, { id: Date.now(), text, completed: false }];
            console.log('addTodo', text);
            save(); render();
        }

        // 删除：filter 留下 id 不匹配的
        function removeTodo(id) {
            todos = todos.filter(t => t.id !== id);
            console.log('removeTodo', id);
            save(); render();
        }

        // 清除所有已完成任务（脱离 AI 手写；控制台调用 clearCompleted() 即可验证）
        function clearCompleted() {
            todos = todos.filter(t => !t.completed);
            console.log('clearCompleted()');
            save(); render();
        }

        // 切换：map + 展开，只替换匹配的那一条，其余原样返回
        function toggleTodo(id) {
            todos = todos.map(t =>
                t.id === id ? { ...t, completed: !t.completed } : t);
            console.log('toggleTodo', id);
            save(); render();
        }

        // ============ 筛选：切换视图状态后重渲染（filter 是视图状态，不需要 save()） ============
        function setFilter(f) {
            filter = f;      // all / done / active
            render();
        }

        // ============ 事件绑定 ============
        addBtn.addEventListener('click', () => {
            const value = input.value.trim();   // 边界检查：空输入（含纯空格）不添加
            if (value === '') {
                alert('输入内容不能为空！');
                return;
            }
            addTodo(value);
            input.value = '';
            input.focus();
        });

        // 支持按回车键添加
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addBtn.click();
        });

        // 筛选按钮绑定：点击后切换视图状态并高亮当前按钮
        document.querySelectorAll('.filter-group button').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.filter-group button.active')
                        .classList.remove('active');
                btn.classList.add('active');
                setFilter(btn.dataset.filter);
            });
        });

        // 首次渲染
        render();
    </script>
</body>
</html>
